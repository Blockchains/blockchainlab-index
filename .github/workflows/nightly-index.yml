name: Nightly index
on:
  schedule:
    - cron: "41 3 * * *"   # 03:41 UTC, after fork-sync (02:17 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Re-index every repo even if its commit is unchanged"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: nightly-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh stars/descriptions from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 indexer/refresh_sources.py sources.json
      - name: Ingest (shallow, blob-filtered clones of every Blockchains fork)
        run: |
          df -h .
          mkdir -p work/ingest-out
          cp -r repos work/ingest-out/repos 2>/dev/null || true
          cp ingest-status.json work/ingest-out/ 2>/dev/null || true
          python3 indexer/ingest.py sources.json work/ingest-out --workdir work/clones --jobs 6 ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Build components, capability tags, embeddings, search shards, SQLite FTS
        run: python3 indexer/build_index.py work/ingest-out . sources.json
      - name: Validate
        run: python3 indexer/validate.py .
      - name: Commit
        run: |
          git config user.name "Blockchain Lab"
          git config user.email "11951015+Blockchains@users.noreply.github.com"
          git add -A catalog.json components repos search vectors taxonomy index.sqlite ingest-status.json sources.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Nightly index $(date -u +%Y-%m-%d)" && git push; fi
